name: Deploy DataSpace Academy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript
        run: node --check js/app.js
      - name: Validate 54-lesson curriculum
        run: node -e "const c=require('./data/curriculum.json');if(c.length!==54)throw new Error('Expected 54 lessons');const w=new Set(c.map(x=>x.week));if(w.size!==18)throw new Error('Expected 18 weeks');for(let n=1;n<=18;n++){if(c.filter(x=>x.week===n).length!==3)throw new Error('Week '+n+' must contain 3 lessons')}"
      - name: Validate 54 interactive mission games
        run: node -e "const g=require('./data/mission-games.json');if(g.length!==54)throw new Error('Expected 54 mission games');for(let i=0;i<g.length;i++){if(!g[i].title||!g[i].brief||!g[i].aha)throw new Error('Incomplete mission game '+i);if(!['sort','sequence','choose','filter','clean','formula','chart','survey','forecast'].includes(g[i].type))throw new Error('Unknown game type '+i)}"
      - name: Validate character worlds and controls
        run: |
          node -e 'const fs=require("fs"); const a=fs.readFileSync("js/app.js","utf8"); const h=fs.readFileSync("index.html","utf8"); const z=fs.readFileSync("assets/voxel-worlds.css","utf8"); for(const key of ["renderVoxelCharacter","renderGameWorldStage","triggerCharacterAction","data-player-action","characterClass"]) if(!a.includes(key)) throw new Error("Missing game feature: "+key); if(!h.includes("assets/voxel-worlds.css")) throw new Error("World styles not linked"); if(!z.includes(".game-world.biome-8")||!z.includes(".voxel-character")) throw new Error("Character world styles incomplete");'
      - name: Validate username accounts and global leaderboard
        run: |
          node --check js/cloud.js
          node -e 'const fs=require("fs");const a=fs.readFileSync("js/app.js","utf8");const h=fs.readFileSync("index.html","utf8");const c=fs.readFileSync("js/cloud.js","utf8");const z=fs.readFileSync("assets/leaderboard.css","utf8");for(const k of ["openAuthModal","applyCloudProfile","renderLeaderboard","refreshLeaderboard","completeLesson","getLeaderboard"])if(!a.includes(k)&&!c.includes(k))throw new Error("Missing account/leaderboard feature: "+k);if(!h.includes("data-view=\"leaderboard\"")||!h.includes("assets/leaderboard.css"))throw new Error("Leaderboard navigation or styles missing");for(const k of ["signUp.email","signIn.email","create_my_profile","dataspace_leaderboard","complete_lesson","claim_arcade_reward"])if(!c.includes(k))throw new Error("Missing cloud operation: "+k);if(!z.includes(".leaderboard-row")||!z.includes(".auth-mode-switch"))throw new Error("Leaderboard/auth styles missing");'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
