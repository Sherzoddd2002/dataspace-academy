name: Deploy DataSpace Academy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript
        run: node --check js/app.js
      - name: Validate 54-lesson curriculum
        run: node -e "const c=require('./data/curriculum.json');if(c.length!==54)throw new Error('Expected 54 lessons');const w=new Set(c.map(x=>x.week));if(w.size!==18)throw new Error('Expected 18 weeks');for(let n=1;n<=18;n++){if(c.filter(x=>x.week===n).length!==3)throw new Error('Week '+n+' must contain 3 lessons')}"
      - name: Validate 54 interactive mission games
        run: node -e "const g=require('./data/mission-games.json');if(g.length!==54)throw new Error('Expected 54 mission games');for(let i=0;i<g.length;i++){if(!g[i].title||!g[i].brief||!g[i].aha)throw new Error('Incomplete mission game '+i);if(!['sort','sequence','choose','filter','clean','formula','chart','survey','forecast'].includes(g[i].type))throw new Error('Unknown game type '+i)}"
      - name: Validate character worlds and controls
        run: |
          node -e 'const fs=require("fs"); const a=fs.readFileSync("js/app.js","utf8"); const h=fs.readFileSync("index.html","utf8"); const z=fs.readFileSync("assets/voxel-worlds.css","utf8"); for(const key of ["renderVoxelCharacter","renderGameWorldStage","triggerCharacterAction","data-player-action","characterClass"]) if(!a.includes(key)) throw new Error("Missing game feature: "+key); if(!h.includes("assets/voxel-worlds.css")) throw new Error("World styles not linked"); if(!z.includes(".game-world.biome-8")||!z.includes(".voxel-character")) throw new Error("Character world styles incomplete");'
      - name: Validate 3D Roblox learning world
        run: |
          node --experimental-default-type=module --check js/world3d.js
          node --experimental-default-type=module --check assets/vendor/three.module.min.js
          node -e 'const fs=require("fs");const h=fs.readFileSync("index.html","utf8");const a=fs.readFileSync("js/app.js","utf8");const w=fs.readFileSync("js/world3d.js","utf8");for(const k of ["assets/world3d.css","js/world3d.js"])if(!h.includes(k))throw new Error("Missing 3D asset: "+k);for(const k of ["renderWorld3DHost","awardWorldQuest","DataSpaceWorld","data-guest-mode"])if(!a.includes(k))throw new Error("Missing 3D integration: "+k);for(const k of ["startQuest","solveQuest","buildIslands","updateNear","DataSpaceWorld"])if(!w.includes(k))throw new Error("Incomplete 3D world: "+k);for(const f of ["js/world3d.js","assets/world3d.css","assets/vendor/three.module.min.js"])if(!fs.existsSync(f))throw new Error("Missing file "+f);'
      - name: Validate username accounts and global leaderboard
        run: |
          node --check js/cloud.js
          node -e 'const fs=require("fs");const a=fs.readFileSync("js/app.js","utf8");const h=fs.readFileSync("index.html","utf8");const c=fs.readFileSync("js/cloud.js","utf8");const z=fs.readFileSync("assets/leaderboard.css","utf8");for(const k of ["openAuthModal","applyCloudProfile","renderLeaderboard","refreshLeaderboard","completeLesson","getLeaderboard"])if(!a.includes(k)&&!c.includes(k))throw new Error("Missing account/leaderboard feature: "+k);if(!h.includes("data-view=\"leaderboard\"")||!h.includes("assets/leaderboard.css"))throw new Error("Leaderboard navigation or styles missing");for(const k of ["signUp.email","signIn.email","create_my_profile","dataspace_leaderboard","complete_lesson","claim_arcade_reward"])if(!c.includes(k))throw new Error("Missing cloud operation: "+k);if(!z.includes(".leaderboard-row")||!z.includes(".auth-mode-switch"))throw new Error("Leaderboard/auth styles missing");if(!c.includes("data?.session?.token")||c.includes("await auth.token()"))throw new Error("Authenticated Data API JWT must come from Neon getSession().session.token");if(!c.includes("auth.getAnonymousToken()")||!c.includes("allowAnonymous: true"))throw new Error("Public leaderboard must use Neon anonymous JWT");'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test Neon Auth and public leaderboard JWT
        env:
          NEON_AUTH_URL: https://ep-little-sea-bae80di9.neonauth.c-8.eu-central-1.aws.neon.tech/neondb/auth
          NEON_DATA_API_URL: https://ep-little-sea-bae80di9.apirest.c-8.eu-central-1.aws.neon.tech/neondb/rest/v1
        run: |
          node --input-type=module <<'NODE'
          const authResponse = await fetch(`${process.env.NEON_AUTH_URL}/token/anonymous`);
          const authText = await authResponse.text();
          let authBody = {};
          try { authBody = JSON.parse(authText); } catch {}
          const token = authBody.token || authBody.data?.token;
          if (!authResponse.ok || !token) {
            throw new Error(`Anonymous JWT endpoint failed (HTTP ${authResponse.status}): ${authText.slice(0, 500)}`);
          }

          const leaderboardUrl = new URL(`${process.env.NEON_DATA_API_URL}/dataspace_leaderboard`);
          leaderboardUrl.searchParams.set('select', 'username,display_name,avatar,character_class,xp,streak,completed_count,created_at');
          leaderboardUrl.searchParams.set('limit', '1');
          const leaderboardResponse = await fetch(leaderboardUrl, {
            headers: { 'Accept': 'application/json', 'Authorization': `Bearer ${token}` },
          });
          const leaderboardText = await leaderboardResponse.text();
          if (!leaderboardResponse.ok) {
            throw new Error(`Public leaderboard read failed (HTTP ${leaderboardResponse.status}): ${leaderboardText.slice(0, 500)}`);
          }
          console.log(`Anonymous JWT works; public leaderboard read passed (HTTP ${leaderboardResponse.status}).`);

          const rpcResponse = await fetch(`${process.env.NEON_DATA_API_URL}/rpc/get_my_profile`, {
            method: 'POST',
            headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
            body: '{}'
          });
          const rpcText = await rpcResponse.text();
          if (rpcResponse.status === 404) {
            throw new Error(`RPC endpoint returned HTTP 404: ${rpcText.slice(0, 500)}`);
          }
          if (![401, 403].includes(rpcResponse.status)) {
            throw new Error(`Expected anonymous RPC permission denial, received HTTP ${rpcResponse.status}: ${rpcText.slice(0, 500)}`);
          }
          console.log(`Private profile RPC correctly rejects anonymous access (HTTP ${rpcResponse.status}).`);
          NODE
