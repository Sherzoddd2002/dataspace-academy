name: Deploy DataSpace Academy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript
        run: node --check js/app.js
      - name: Validate 54-lesson curriculum
        run: node -e "const c=require('./data/curriculum.json');if(c.length!==54)throw new Error('Expected 54 lessons');const w=new Set(c.map(x=>x.week));if(w.size!==18)throw new Error('Expected 18 weeks');for(let n=1;n<=18;n++){if(c.filter(x=>x.week===n).length!==3)throw new Error('Week '+n+' must contain 3 lessons')}"
      - name: Validate 54 interactive mission games
        run: node -e "const g=require('./data/mission-games.json');if(g.length!==54)throw new Error('Expected 54 mission games');for(let i=0;i<g.length;i++){if(!g[i].title||!g[i].brief||!g[i].aha)throw new Error('Incomplete mission game '+i);if(!['sort','sequence','choose','filter','clean','formula','chart'].includes(g[i].type))throw new Error('Unknown game type '+i)}"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
